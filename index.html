<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elysian Threads - Premium Clothing Showroom</title>
    <style>
        :root {
            --bg: #faf8f5; --surface: #ffffff; --text: #2c2c2c; --text-light: #6b6b6b;
            --accent: #c9a96e; --accent-dark: #a8874e; --rose: #e8b4b8; --navy: #1e2a38;
            --border: #e8e4df; --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --radius: 12px; --font: 'Segoe UI', system-ui, sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: var(--font); background: var(--bg); color: var(--text); }
        .header { background: var(--surface); border-bottom:1px solid var(--border); padding:0 2rem; position:sticky; top:0; z-index:100; }
        .header-inner { max-width:1300px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; height:64px; }
        .brand { font-family: 'Georgia', serif; font-size:1.6rem; font-weight:700; color:var(--navy); }
        .brand span { color:var(--accent); }
        .hero-banner { background:linear-gradient(135deg, #1e2a38, #2c4055, #3a4f65); border-radius:var(--radius); padding:3rem 2rem; margin:2rem auto; max-width:1300px; color:#fff; text-align:center; }
        .hero-banner h1 { font-family:'Georgia', serif; font-size:2.4rem; margin-bottom:0.5rem; }
        .filters-bar { max-width:1300px; margin:0 auto 1.5rem; display:flex; gap:0.8rem; flex-wrap:wrap; align-items:center; }
        .filter-chip { padding:0.5rem 1.1rem; border-radius:50px; border:1.5px solid var(--border); background:var(--surface); cursor:pointer; font-size:0.85rem; }
        .filter-chip.active, .filter-chip:hover { background:var(--navy); color:#fff; border-color:var(--navy); }
        .search-input { padding:0.55rem 1.2rem; border-radius:50px; border:1.5px solid var(--border); font-size:0.9rem; outline:none; min-width:200px; }
        .product-grid { max-width:1300px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:1.5rem; padding-bottom:2rem; }
        .product-card { background:var(--surface); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); transition:0.25s; cursor:pointer; }
        .product-card:hover { transform:translateY(-4px); }
        .product-thumb { width:100%; height:240px; background-size:cover; background-position:center; background-color:#e8e4df; display:flex; align-items:center; justify-content:center; font-size:5rem; }
        .product-info { padding:1.2rem; }
        .product-category { font-size:0.75rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--accent-dark); font-weight:600; }
        .product-name { font-weight:600; font-size:1.05rem; color:var(--navy); }
        .product-price { font-weight:700; font-size:1.2rem; color:var(--navy); margin-top:0.5rem; }
        .product-meta { font-size:0.82rem; color:var(--text-light); display:flex; gap:0.8rem; flex-wrap:wrap; margin:0.4rem 0; }
        .btn { padding:0.6rem 1.5rem; border-radius:50px; border:none; cursor:pointer; font-weight:600; font-size:0.9rem; }
        .btn-primary { background:var(--navy); color:#fff; }
        .btn-primary:hover { background:#2c4055; }

        /* Detail modal */
        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:200; display:flex; align-items:center; justify-content:center; animation:fadeIn 0.2s; }
        @keyframes fadeIn { from{opacity:0} to{opacity:1} }
        .modal-detail { background:var(--surface); border-radius:var(--radius); max-width:700px; width:95%; max-height:90vh; overflow-y:auto; padding:2rem; animation:slideUp 0.3s; }
        @keyframes slideUp { from{transform:translateY(30px);opacity:0} to{transform:translateY(0);opacity:1} }
        .modal-detail h2 { font-family:'Georgia', serif; color:var(--navy); margin-bottom:1rem; }
        .image-gallery { display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1.5rem; }
        .image-gallery img { width:100%; max-width:200px; height:150px; object-fit:cover; border-radius:8px; }
        .detail-price { font-size:1.5rem; font-weight:700; color:var(--navy); }
        .btn-reserve { background:#27ae60; color:#fff; width:100%; padding:0.8rem; font-size:1rem; margin-top:1rem; }
        .btn-reserve:hover { background:#219a52; }
        .btn-close { background:var(--navy); color:#fff; margin-top:0.8rem; width:100%; }
        .reservation-success { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:300; display:flex; align-items:center; justify-content:center; }
        .footer { text-align:center; padding:2rem; color:var(--text-light); font-size:0.8rem; }
        .toast { position:fixed; bottom:2rem; right:2rem; background:var(--navy); color:#fff; padding:0.8rem 1.5rem; border-radius:50px; font-weight:600; z-index:400; animation:slideUp 0.3s ease, fadeOut 0.3s ease 2.5s forwards; }
        @keyframes fadeOut { to{opacity:0; transform:translateY(20px)} }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="brand">Elysian<span>Threads</span></div>
        </div>
    </header>

    <div class="hero-banner">
        <h1>Discover Your Style</h1>
        <p>Tap any item to view details and reserve with a call to <strong>1234567890</strong></p>
    </div>

    <div class="filters-bar">
        <button class="filter-chip active" data-category="all">All</button>
        <button class="filter-chip" data-category="Men">👔 Men</button>
        <button class="filter-chip" data-category="Women">👗 Women</button>
        <button class="filter-chip" data-category="Kids">👶 Kids</button>
        <button class="filter-chip" data-category="Accessories">👜 Accessories</button>
        <input type="text" class="search-input" id="searchInput" placeholder="🔍 Search clothing...">
    </div>

    <div class="product-grid" id="productGrid"></div>
    <div class="empty-state" id="emptyState" style="display:none; text-align:center; padding:2rem;">No items found.</div>

    <!-- Detail modal -->
    <div class="modal-overlay" id="detailModal" style="display:none;">
        <div class="modal-detail" id="detailContent"></div>
    </div>

    <!-- Reservation success modal -->
    <div class="reservation-success" id="reservationSuccess" style="display:none;">
        <div class="modal-detail" style="text-align:center;">
            <h2>✅ Reserved!</h2>
            <p>Call us to finalise your reservation:</p>
            <div style="font-size:2rem; font-weight:700; color:#c9a96e; margin:1rem 0;">
                <a href="tel:1234567890" style="color:inherit; text-decoration:none;">📞 1234567890</a>
            </div>
            <p id="reservedItemName"></p>
            <a href="tel:1234567890" class="btn btn-primary" style="display:inline-block; margin:0.5rem;">📞 Call Now</a>
            <button class="btn btn-close" onclick="document.getElementById('reservationSuccess').style.display='none'">Close</button>
        </div>
    </div>

    <div class="footer">© 2025 Elysian Threads</div>
    <div id="toastContainer"></div>

    <script>
        const PHONE = '1234567890';
        const STORAGE_INVENTORY = 'elysian_threads_inventory';
        const STORAGE_RESERVATIONS = 'elysian_threads_reservations';

        const SEED_INVENTORY = [
            { id:'1', name:'Classic Wool Suit', category:'Men', price:8999, size:'M,L,XL', color:'Charcoal Grey', stock:8, images:[] },
            { id:'2', name:'Linen Casual Shirt', category:'Men', price:2499, size:'S,M,L,XL', color:'Sky Blue', stock:15, images:[] },
            { id:'3', name:'Slim Fit Chinos', category:'Men', price:3299, size:'30-38', color:'Khaki', stock:12, images:[] },
            { id:'4', name:'Evening Silk Gown', category:'Women', price:12999, size:'S,M,L', color:'Burgundy', stock:5, images:[] },
            { id:'5', name:'Floral Maxi Dress', category:'Women', price:4599, size:'XS-L', color:'Rose Pink', stock:10, images:[] },
            { id:'6', name:'Designer Blouse', category:'Women', price:1899, size:'S,M,L,XL', color:'Ivory White', stock:20, images:[] },
            { id:'7', name:'Kids Denim Jacket', category:'Kids', price:1799, size:'4Y-12Y', color:'Light Wash', stock:14, images:[] },
            { id:'8', name:'Cotton T-Shirt Pack', category:'Kids', price:999, size:'2Y-10Y', color:'Assorted', stock:25, images:[] },
            { id:'9', name:'Leather Handbag', category:'Accessories', price:5499, size:'One Size', color:'Tan Brown', stock:6, images:[] },
            { id:'10', name:'Silk Printed Scarf', category:'Accessories', price:1499, size:'One Size', color:'Multicolor', stock:18, images:[] }
        ];

        let inventory = [], reservations = [], currentCategory = 'all';

        function loadData(){
            inventory = JSON.parse(localStorage.getItem(STORAGE_INVENTORY)) || JSON.parse(JSON.stringify(SEED_INVENTORY));
            reservations = JSON.parse(localStorage.getItem(STORAGE_RESERVATIONS)) || [];
            if(!localStorage.getItem(STORAGE_INVENTORY)) localStorage.setItem(STORAGE_INVENTORY, JSON.stringify(inventory));
        }

        function saveAll(){
            localStorage.setItem(STORAGE_INVENTORY, JSON.stringify(inventory));
            localStorage.setItem(STORAGE_RESERVATIONS, JSON.stringify(reservations));
        }

        function showToast(msg){
            const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
            document.getElementById('toastContainer').appendChild(t);
            setTimeout(()=>t.remove(),3000);
        }

        function filterProducts(){
            const term = document.getElementById('searchInput').value.toLowerCase();
            return inventory.filter(i=> (currentCategory==='all' || i.category===currentCategory) &&
                (i.name.toLowerCase().includes(term) || i.category.toLowerCase().includes(term) || (i.color||'').toLowerCase().includes(term))
            );
        }

        function renderGrid(){
            const filtered = filterProducts();
            document.getElementById('emptyState').style.display = filtered.length ? 'none' : 'block';
            document.getElementById('productGrid').innerHTML = filtered.map(item => {
                const firstImg = (item.images && item.images.length>0) ? item.images[0] : '';
                const thumbStyle = firstImg ? `background-image:url(${firstImg})` : '';
                const emoji = { Men:'👔', Women:'👗', Kids:'👶', Accessories:'👜' }[item.category] || '👕';
                return `
                <div class="product-card" onclick="openDetail('${item.id}')">
                    <div class="product-thumb" style="${thumbStyle}">
                        ${!firstImg ? emoji : ''}
                    </div>
                    <div class="product-info">
                        <span class="product-category">${escapeHtml(item.category)}</span>
                        <span class="product-name">${escapeHtml(item.name)}</span>
                        <div class="product-meta">
                            ${item.size ? `<span>📏 ${escapeHtml(item.size)}</span>` : ''}
                            ${item.color ? `<span>🎨 ${escapeHtml(item.color)}</span>` : ''}
                        </div>
                        <span class="product-price">₹${item.price.toLocaleString('en-IN')}</span>
                    </div>
                </div>`;
            }).join('');
        }

        function openDetail(id){
            const item = inventory.find(i=>i.id===id);
            if(!item) return;
            const content = document.getElementById('detailContent');
            const imagesHtml = (item.images && item.images.length>0)
                ? item.images.map(img => `<img src="${img}" alt="">`).join('')
                : `<div style="width:100%; height:200px; background:#e8e4df; display:flex; align-items:center; justify-content:center; font-size:4rem;">👕</div>`;
            content.innerHTML = `
                <h2>${escapeHtml(item.name)}</h2>
                <div class="image-gallery">${imagesHtml}</div>
                <p class="product-category">${escapeHtml(item.category)}</p>
                <p class="detail-price">₹${item.price.toLocaleString('en-IN')}</p>
                <div style="display:flex; gap:1rem; flex-wrap:wrap; margin:1rem 0; color:#6b6b6b;">
                    ${item.size ? `<span>📏 Size: <strong>${escapeHtml(item.size)}</strong></span>` : ''}
                    ${item.color ? `<span>🎨 Color: <strong>${escapeHtml(item.color)}</strong></span>` : ''}
                    <span>📦 Stock: <strong>${item.stock}</strong></span>
                </div>
                ${item.stock > 0
                    ? `<button class="btn btn-reserve" onclick="reserveFromDetail('${item.id}')">📞 Reserve</button>`
                    : `<button class="btn btn-primary" disabled style="width:100%; opacity:0.5;">Sold Out</button>`
                }
                <button class="btn btn-close" onclick="closeDetail()">Close</button>
            `;
            document.getElementById('detailModal').style.display = 'flex';
        }

        function closeDetail(){
            document.getElementById('detailModal').style.display = 'none';
        }

        function reserveFromDetail(id){
            const item = inventory.find(i=>i.id===id);
            if(!item || item.stock<=0){ showToast('Out of stock!'); closeDetail(); return; }
            item.stock--;
            reservations.push({
                id:'res_'+Date.now(), itemId:item.id, itemName:item.name, itemCategory:item.category,
                itemPrice:item.price, timestamp:new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata'})
            });
            saveAll();
            document.getElementById('reservedItemName').textContent = item.name;
            document.getElementById('reservationSuccess').style.display = 'flex';
            closeDetail();
            renderGrid();
        }

        function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

        // Filters
        document.querySelectorAll('.filter-chip').forEach(chip=>{
            chip.addEventListener('click', function(){
                document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
                this.classList.add('active');
                currentCategory = this.dataset.category;
                renderGrid();
            });
        });
        document.getElementById('searchInput').addEventListener('input', renderGrid);
        document.getElementById('detailModal').addEventListener('click', function(e){ if(e.target===this) closeDetail(); });
        document.addEventListener('keydown', e=>{ if(e.key==='Escape') { closeDetail(); document.getElementById('reservationSuccess').style.display='none'; } });

        loadData();
        renderGrid();
    </script>
</body>
</html>
