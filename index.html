<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wire — Messages &amp; Calls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0E1420;
    --panel: #141B2A;
    --panel-2: #1A2333;
    --border: #26314429;
    --border-solid: #263144;
    --text: #E7EAF2;
    --text-dim: #8791A6;
    --accent: #4FD1C5;
    --accent-dim: #2E8B82;
    --call: #FF6B6B;
    --call-dim: #C44F4F;
    --radius: 10px;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    overflow:hidden;
  }
  h1,h2,h3,.brand,.display{ font-family:'Space Grotesk', system-ui, sans-serif; }

  /* ---------- Auth screen ---------- */
  #authScreen{
    height:100%; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 20% 20%, #16324a55, transparent 40%),
      radial-gradient(circle at 80% 80%, #4fd1c522, transparent 45%),
      var(--bg);
  }
  .authBox{
    width: 360px; max-width:90vw; background:var(--panel);
    border:1px solid var(--border-solid); border-radius:14px; padding:36px 32px;
  }
  .authBox .brand{ font-size:26px; font-weight:700; letter-spacing:-0.02em; margin:0 0 4px; }
  .authBox .tag{ color:var(--text-dim); font-size:13px; margin:0 0 28px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; }
  .field input{
    width:100%; padding:11px 12px; background:var(--panel-2); border:1px solid var(--border-solid);
    border-radius:8px; color:var(--text); font-size:14px; font-family:inherit;
  }
  .field input:focus{ outline:none; border-color:var(--accent); }
  .authActions{ display:flex; gap:10px; margin-top:22px; }
  button{ font-family:inherit; cursor:pointer; }
  .btn{
    border:none; border-radius:8px; padding:11px 16px; font-size:14px; font-weight:600;
    background:var(--accent); color:#08211E; flex:1; transition:transform .08s ease, opacity .15s;
  }
  .btn:active{ transform: scale(0.97); }
  .btn.secondary{ background:transparent; color:var(--text); border:1px solid var(--border-solid); }
  .btn:disabled{ opacity:.5; cursor:default; }
  #authError{ color:var(--call); font-size:13px; margin-top:12px; min-height:16px; }
  .authSwitch{ text-align:center; margin-top:18px; font-size:13px; color:var(--text-dim); }
  .authSwitch a{ color:var(--accent); text-decoration:none; cursor:pointer; }

  /* ---------- App shell ---------- */
  #app{ display:none; height:100%; }
  #app.active{ display:flex; }

  #sidebar{
    width:300px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border-solid);
    display:flex; flex-direction:column;
  }
  #meRow{
    display:flex; align-items:center; gap:10px; padding:16px; border-bottom:1px solid var(--border-solid);
  }
  .avatar{
    width:38px; height:38px; border-radius:50%; background:var(--accent-dim);
    color:#08211E; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;
    flex-shrink:0;
  }
  .avatar.small{ width:30px; height:30px; font-size:12px; }
  #meRow .who{ flex:1; min-width:0; }
  #meRow .name{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #meRow .status{ font-size:11px; color:var(--accent); }
  #signOutBtn{ background:transparent; border:none; color:var(--text-dim); font-size:12px; }
  #signOutBtn:hover{ color:var(--text); }

  #contactSearch{ padding:12px 14px; border-bottom:1px solid var(--border-solid); }
  #contactSearch input{
    width:100%; padding:9px 12px; background:var(--panel-2); border:1px solid var(--border-solid);
    border-radius:8px; color:var(--text); font-size:13px;
  }
  #contactList{ flex:1; overflow-y:auto; }
  .contact{
    display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer; border-bottom:1px solid var(--border);
  }
  .contact:hover{ background:var(--panel-2); }
  .contact.active{ background:var(--panel-2); border-left:2px solid var(--accent); }
  .contact .cname{ font-size:13.5px; font-weight:500; }
  .contact .cstatus{ font-size:11px; color:var(--text-dim); }
  .emptyList{ padding:20px 16px; color:var(--text-dim); font-size:13px; line-height:1.5; }

  #main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  #chatHeader{
    height:64px; flex-shrink:0; display:flex; align-items:center; gap:12px; padding:0 20px;
    border-bottom:1px solid var(--border-solid); background:var(--panel);
  }
  #chatHeader .cname{ font-size:15px; font-weight:600; }
  #chatHeader .cstatus{ font-size:11.5px; color:var(--text-dim); }
  .headerSpacer{ flex:1; }
  .iconBtn{
    width:38px; height:38px; border-radius:50%; background:var(--panel-2); border:1px solid var(--border-solid);
    color:var(--text); display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  .iconBtn:hover{ background:var(--border-solid); }
  .iconBtn.call{ color:var(--accent); }
  .iconBtn.hangup{ background:var(--call); color:#fff; border-color:var(--call); }

  #noChat{ flex:1; display:flex; align-items:center; justify-content:center; color:var(--text-dim); font-size:14px; }

  #messages{ flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:10px; }
  .msgRow{ display:flex; }
  .msgRow.mine{ justify-content:flex-end; }
  .bubble{
    max-width:62%; padding:9px 13px; border-radius:14px; font-size:14px; line-height:1.45;
    background:var(--panel-2); border:1px solid var(--border-solid);
  }
  .msgRow.mine .bubble{ background:var(--accent-dim); border-color:var(--accent-dim); color:#EAFBF9; }
  .bubble .time{ display:block; font-size:10px; color:var(--text-dim); margin-top:4px; }
  .msgRow.mine .bubble .time{ color:#C9EFEA; }
  .bubble img, .bubble video{ max-width:260px; border-radius:8px; display:block; margin-bottom:4px; }
  .bubble a.fileLink{ color:inherit; text-decoration:underline; }

  #composer{
    display:flex; align-items:center; gap:10px; padding:14px 20px; border-top:1px solid var(--border-solid);
    background:var(--panel);
  }
  #composer input[type=text]{
    flex:1; padding:11px 14px; background:var(--panel-2); border:1px solid var(--border-solid);
    border-radius:20px; color:var(--text); font-size:14px;
  }
  #composer input[type=text]:focus{ outline:none; border-color:var(--accent); }
  #fileInput{ display:none; }
  #sendBtn{ background:var(--accent); color:#08211E; border:none; width:40px; height:40px; border-radius:50%; font-size:16px; }

  /* ---------- Call overlay ---------- */
  #callOverlay{
    display:none; position:fixed; inset:0; background:#080C14EE; z-index:50;
    flex-direction:column; align-items:center; justify-content:center; gap:20px;
  }
  #callOverlay.active{ display:flex; }
  #callStatusText{ color:var(--text-dim); font-size:13px; letter-spacing:.02em; }
  #callPeerName{ font-size:22px; font-weight:600; }
  .videoStage{ position:relative; width:min(720px, 90vw); aspect-ratio:16/10; background:#000; border-radius:14px; overflow:hidden; display:none; }
  .videoStage.active{ display:block; }
  #remoteVideo{ width:100%; height:100%; object-fit:cover; }
  #localVideo{
    position:absolute; bottom:14px; right:14px; width:120px; border-radius:8px; border:2px solid #1A2333;
    transform:scaleX(-1);
  }
  .callAvatarBig{
    width:96px; height:96px; border-radius:50%; background:var(--accent-dim); color:#08211E;
    display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:700;
  }
  .callControls{ display:flex; gap:16px; }
  .callBtn{
    width:54px; height:54px; border-radius:50%; border:none; font-size:20px;
    display:flex; align-items:center; justify-content:center; background:var(--panel-2); color:var(--text);
  }
  .callBtn.end{ background:var(--call); color:#fff; }
  .callBtn.muted{ background:var(--accent); color:#08211E; }
  #incomingBanner{
    display:none; position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:60;
    background:var(--panel); border:1px solid var(--border-solid); border-radius:12px; padding:14px 18px;
    align-items:center; gap:14px; box-shadow:0 10px 30px #00000066;
  }
  #incomingBanner.active{ display:flex; }
  #incomingBanner .txt{ font-size:13.5px; }
  #incomingBanner .txt b{ display:block; font-size:14.5px; }
  .miniBtn{ border:none; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:600; }
  .miniBtn.accept{ background:var(--accent); color:#08211E; }
  .miniBtn.decline{ background:var(--call); color:#fff; }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border-solid); border-radius:4px; }
</style>
</head>
<body>

<!-- AUTH -->
<div id="authScreen">
  <div class="authBox">
    <p class="brand">Wire</p>
    <p class="tag" id="authTag">Sign in to send messages and start calls.</p>
    <div class="field">
      <label>Email</label>
      <input type="email" id="authEmail" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="authPassword" placeholder="Your password" autocomplete="current-password">
    </div>
    <div class="authActions">
      <button class="btn" id="authSubmit">Sign in</button>
    </div>
    <p id="authError"></p>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div id="sidebar">
    <div id="meRow">
      <div class="avatar" id="meAvatar">?</div>
      <div class="who">
        <div class="name" id="meName">—</div>
        <div class="status">Online</div>
      </div>
      <button id="signOutBtn">Sign out</button>
    </div>
    <div id="contactSearch">
      <input type="text" id="searchInput" placeholder="Find people by email…">
    </div>
    <div id="contactList"><div class="emptyList">Search for a person's email above to start a conversation.</div></div>
  </div>

  <div id="main">
    <div id="noChat">Select a conversation, or search for someone by email.</div>
    <div id="chatArea" style="display:none; flex-direction:column; height:100%;">
      <div id="chatHeader">
        <div class="avatar small" id="peerAvatar">?</div>
        <div>
          <div class="cname" id="peerName">—</div>
          <div class="cstatus" id="peerStatus">—</div>
        </div>
        <div class="headerSpacer"></div>
        <button class="iconBtn call" id="voiceCallBtn" title="Voice call">📞</button>
        <button class="iconBtn call" id="videoCallBtn" title="Video call">🎥</button>
      </div>
      <div id="messages"></div>
      <div id="composer">
        <button class="iconBtn" id="attachBtn" title="Send a file">📎</button>
        <input type="file" id="fileInput">
        <input type="text" id="textInput" placeholder="Type a message…">
        <button id="sendBtn">➤</button>
      </div>
    </div>
  </div>
</div>

<!-- Incoming call banner -->
<div id="incomingBanner">
  <div class="avatar" id="incomingAvatar">?</div>
  <div class="txt"><b id="incomingName">—</b><span id="incomingType">Incoming call</span></div>
  <button class="miniBtn accept" id="acceptCallBtn">Accept</button>
  <button class="miniBtn decline" id="declineCallBtn">Decline</button>
</div>

<!-- Call overlay -->
<div id="callOverlay">
  <div class="callAvatarBig" id="callAvatarBig">?</div>
  <div id="callPeerName">—</div>
  <div id="callStatusText">Calling…</div>
  <div class="videoStage" id="videoStage">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
  </div>
  <div class="callControls">
    <button class="callBtn" id="muteBtn" title="Mute">🎙️</button>
    <button class="callBtn end" id="endCallBtn" title="End call">☎</button>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script>

<script>
/* ===================== Firebase init ===================== */
const firebaseConfig = {
  apiKey: "AIzaSyC20z6dWPD4Fjinc6KKpVDmm9rQUGeKjHU",
  authDomain: "kartify-a4e66.firebaseapp.com",
  databaseURL: "https://kartify-a4e66-default-rtdb.firebaseio.com",
  projectId: "kartify-a4e66",
  storageBucket: "kartify-a4e66.firebasestorage.app",
  messagingSenderId: "663778229564",
  appId: "1:663778229564:web:5271acb085f30893913239",
  measurementId: "G-GH5JGVJYMP"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

/* ===================== State ===================== */
let currentUser = null;      // firebase auth user
let currentUserDoc = null;   // {uid,email,displayName}
let activePeer = null;       // {uid,email,displayName}
let activeChatId = null;
let unsubMessages = null;
let unsubSearch = null;

let pc = null;               // RTCPeerConnection
let localStream = null;
let currentCallDocRef = null;
let currentCallRole = null;  // 'caller' | 'callee'
let currentCallType = null;  // 'audio' | 'video'
let unsubIncoming = null;
let unsubCallDoc = null;
let unsubRemoteCandidates = null;
let isMuted = false;

const rtcConfig = {
  iceServers: [
    { urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"] }
  ]
};

function initials(name){
  if(!name) return "?";
  return name.trim().split(/\s+/).map(p=>p[0]).slice(0,2).join("").toUpperCase();
}
function chatIdFor(a,b){ return [a,b].sort().join("_"); }

/* ===================== Auth UI (login only) ===================== */
const authEmail = document.getElementById('authEmail');
const authPassword = document.getElementById('authPassword');
const authError = document.getElementById('authError');
const authSubmit = document.getElementById('authSubmit');

// Surface ANY unexpected script error on the login screen instead of failing silently.
window.addEventListener('error', (e) => {
  if(document.getElementById('authScreen').style.display !== "none"){
    authError.textContent = "Something went wrong loading the app: " + (e.message || "unknown error");
  }
});
window.addEventListener('unhandledrejection', (e) => {
  if(document.getElementById('authScreen').style.display !== "none"){
    authError.textContent = "Sign-in failed: " + (e.reason && e.reason.message ? e.reason.message : e.reason);
  }
});

function doLogin(){
  const email = authEmail.value.trim();
  const password = authPassword.value;
  authError.textContent = "";

  if(!email || !password){
    authError.textContent = "Enter both an email and a password.";
    return;
  }

  authSubmit.disabled = true;
  authSubmit.textContent = "Signing in…";

  auth.signInWithEmailAndPassword(email, password)
    .then(() => {
      // onAuthStateChanged below handles moving to the dashboard.
    })
    .catch((e) => {
      console.error("Login failed:", e);
      authError.textContent = friendlyAuthError(e);
    })
    .finally(() => {
      authSubmit.disabled = false;
      authSubmit.textContent = "Sign in";
    });
}

authSubmit.onclick = doLogin;
authPassword.addEventListener('keydown', (e) => { if(e.key === "Enter") doLogin(); });
authEmail.addEventListener('keydown', (e) => { if(e.key === "Enter") doLogin(); });

function friendlyAuthError(e){
  const map = {
    "auth/invalid-email": "That email address doesn't look right.",
    "auth/user-not-found": "No account found for that email. Add one in Firebase Console → Authentication → Users.",
    "auth/wrong-password": "Incorrect password.",
    "auth/invalid-credential": "Email or password is incorrect.",
    "auth/user-disabled": "This account has been disabled.",
    "auth/too-many-requests": "Too many attempts — wait a bit and try again.",
    "auth/network-request-failed": "Network error — check your internet connection.",
    "auth/api-key-not-valid.-please-pass-a-valid-api-key.": "Firebase API key is invalid — check the config.",
    "auth/configuration-not-found": "Email/Password sign-in isn't enabled in Firebase Console → Authentication → Sign-in method."
  };
  return map[e.code] || (e.message || "Sign-in failed for an unknown reason.");
}

document.getElementById('signOutBtn').onclick = async () => {
  if(currentUser){
    await db.collection("users").doc(currentUser.uid).update({ online:false, lastSeen: firebase.firestore.FieldValue.serverTimestamp() }).catch(()=>{});
  }
  await auth.signOut();
};

/* ===================== Auth state ===================== */
auth.onAuthStateChanged(async (user) => {
  if(user){
    currentUser = user;
    const docSnap = await db.collection("users").doc(user.uid).get();
    if(!docSnap.exists){
      currentUserDoc = { uid:user.uid, email:user.email, displayName:user.displayName || user.email.split("@")[0] };
      await db.collection("users").doc(user.uid).set({
        ...currentUserDoc, emailLower:user.email.toLowerCase(), online:true,
        lastSeen: firebase.firestore.FieldValue.serverTimestamp()
      });
    } else {
      currentUserDoc = docSnap.data();
      await db.collection("users").doc(user.uid).update({ online:true, lastSeen: firebase.firestore.FieldValue.serverTimestamp() });
    }
    document.getElementById('meName').textContent = currentUserDoc.displayName;
    document.getElementById('meAvatar').textContent = initials(currentUserDoc.displayName);
    document.getElementById('authScreen').style.display = "none";
    document.getElementById('app').classList.add('active');
    listenForIncomingCalls();
  } else {
    currentUser = null; currentUserDoc = null;
    document.getElementById('authScreen').style.display = "flex";
    document.getElementById('app').classList.remove('active');
    if(unsubIncoming) unsubIncoming();
  }
});

/* ===================== Contact search ===================== */
const searchInput = document.getElementById('searchInput');
const contactList = document.getElementById('contactList');
let searchTimer = null;
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runSearch, 300);
});
async function runSearch(){
  const term = searchInput.value.trim().toLowerCase();
  if(!term){
    contactList.innerHTML = '<div class="emptyList">Search for a person\'s email above to start a conversation.</div>';
    return;
  }
  const snap = await db.collection("users")
    .orderBy("emailLower")
    .startAt(term).endAt(term + "\uf8ff")
    .limit(15).get();
  contactList.innerHTML = "";
  let found = false;
  snap.forEach(doc => {
    const u = doc.data();
    if(u.uid === currentUser.uid) return;
    found = true;
    const row = document.createElement('div');
    row.className = "contact";
    row.innerHTML = `<div class="avatar small">${initials(u.displayName)}</div>
      <div><div class="cname">${escapeHtml(u.displayName)}</div><div class="cstatus">${escapeHtml(u.email)}</div></div>`;
    row.onclick = () => openChat(u);
    contactList.appendChild(row);
  });
  if(!found) contactList.innerHTML = '<div class="emptyList">No one found with that email.</div>';
}
function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s || ""; return d.innerHTML;
}

/* ===================== Chat ===================== */
function openChat(peer){
  activePeer = peer;
  activeChatId = chatIdFor(currentUser.uid, peer.uid);
  document.getElementById('noChat').style.display = "none";
  document.getElementById('chatArea').style.display = "flex";
  document.getElementById('peerName').textContent = peer.displayName;
  document.getElementById('peerAvatar').textContent = initials(peer.displayName);
  document.getElementById('peerStatus').textContent = peer.email;
  document.querySelectorAll('.contact').forEach(c => c.classList.remove('active'));

  if(unsubMessages) unsubMessages();
  const msgsEl = document.getElementById('messages');
  msgsEl.innerHTML = "";
  unsubMessages = db.collection("chats").doc(activeChatId).collection("messages")
    .orderBy("timestamp", "asc")
    .onSnapshot(snap => {
      snap.docChanges().forEach(change => {
        if(change.type === "added"){
          renderMessage(change.doc.data());
        }
      });
      msgsEl.scrollTop = msgsEl.scrollHeight;
    });
}

function renderMessage(m){
  const msgsEl = document.getElementById('messages');
  const row = document.createElement('div');
  row.className = "msgRow" + (m.senderId === currentUser.uid ? " mine" : "");
  const bubble = document.createElement('div');
  bubble.className = "bubble";
  let inner = "";
  if(m.mediaUrl){
    if(m.mediaType && m.mediaType.startsWith("image/")){
      inner += `<img src="${m.mediaUrl}" alt="attachment">`;
    } else if(m.mediaType && m.mediaType.startsWith("video/")){
      inner += `<video src="${m.mediaUrl}" controls></video>`;
    } else {
      inner += `<a class="fileLink" href="${m.mediaUrl}" target="_blank">📎 ${escapeHtml(m.fileName || "Download file")}</a>`;
    }
  }
  if(m.text) inner += `<div>${escapeHtml(m.text)}</div>`;
  const t = m.timestamp && m.timestamp.toDate ? m.timestamp.toDate() : new Date();
  inner += `<span class="time">${t.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>`;
  bubble.innerHTML = inner;
  row.appendChild(bubble);
  msgsEl.appendChild(row);
}

document.getElementById('sendBtn').onclick = sendText;
document.getElementById('textInput').addEventListener('keydown', e => {
  if(e.key === "Enter") sendText();
});
async function sendText(){
  const input = document.getElementById('textInput');
  const text = input.value.trim();
  if(!text || !activeChatId) return;
  input.value = "";
  await db.collection("chats").doc(activeChatId).collection("messages").add({
    senderId: currentUser.uid, text, timestamp: firebase.firestore.FieldValue.serverTimestamp()
  });
  await db.collection("chats").doc(activeChatId).set({
    participants:[currentUser.uid, activePeer.uid], lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge:true });
}

document.getElementById('attachBtn').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if(!file || !activeChatId) return;
  if(file.size > 25 * 1024 * 1024){ alert("Please choose a file under 25MB."); return; }
  const path = `chatMedia/${activeChatId}/${Date.now()}_${file.name}`;
  const ref = storage.ref(path);
  await ref.put(file);
  const url = await ref.getDownloadURL();
  await db.collection("chats").doc(activeChatId).collection("messages").add({
    senderId: currentUser.uid, mediaUrl: url, mediaType: file.type, fileName: file.name,
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  });
  await db.collection("chats").doc(activeChatId).set({
    participants:[currentUser.uid, activePeer.uid], lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge:true });
});

/* ===================== WebRTC Calling =====================
   Signaling model (Firestore):
   calls/{calleeUid} = { from, fromName, fromEmail, chatId, type, offer, status }
     status: ringing -> accepted -> ended
   calls/{calleeUid}/callerCandidates/*
   calls/{calleeUid}/calleeCandidates/*
*/
document.getElementById('voiceCallBtn').onclick = () => startCall('audio');
document.getElementById('videoCallBtn').onclick = () => startCall('video');

async function startCall(type){
  if(!activePeer) return;
  currentCallType = type;
  currentCallRole = 'caller';
  currentCallDocRef = db.collection("calls").doc(activePeer.uid);

  try{
    localStream = await navigator.mediaDevices.getUserMedia({
      audio:true, video: type === 'video'
    });
  }catch(e){
    alert("Couldn't access your microphone/camera: " + e.message);
    return;
  }

  showCallOverlay(activePeer, type, "Calling…");

  pc = new RTCPeerConnection(rtcConfig);
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  wireRemoteStream();

  pc.onicecandidate = (e) => {
    if(e.candidate) currentCallDocRef.collection("callerCandidates").add(e.candidate.toJSON());
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  await currentCallDocRef.set({
    from: currentUser.uid, fromName: currentUserDoc.displayName, fromEmail: currentUserDoc.email,
    chatId: activeChatId, type, status: "ringing",
    offer: { type: offer.type, sdp: offer.sdp }
  });

  unsubCallDoc = currentCallDocRef.onSnapshot(async (snap) => {
    const data = snap.data();
    if(!data) return;
    if(data.status === "accepted" && data.answer && pc.currentRemoteDescription == null){
      await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
      document.getElementById('callStatusText').textContent = "Connected";
    }
    if(data.status === "ended"){
      cleanupCall(false);
    }
    if(data.status === "declined"){
      document.getElementById('callStatusText').textContent = "Call declined";
      setTimeout(() => cleanupCall(false), 1200);
    }
  });

  unsubRemoteCandidates = currentCallDocRef.collection("calleeCandidates")
    .onSnapshot(snap => {
      snap.docChanges().forEach(change => {
        if(change.type === "added" && pc){
          pc.addIceCandidate(new RTCIceCandidate(change.doc.data())).catch(()=>{});
        }
      });
    });
}

function listenForIncomingCalls(){
  if(unsubIncoming) unsubIncoming();
  unsubIncoming = db.collection("calls").doc(currentUser.uid).onSnapshot(snap => {
    const data = snap.data();
    if(!data) { hideIncomingBanner(); return; }
    if(data.status === "ringing"){
      showIncomingBanner(data);
    } else if(data.status === "ended" || data.status === "declined"){
      hideIncomingBanner();
    }
  });
}

let pendingIncoming = null;
function showIncomingBanner(data){
  pendingIncoming = data;
  document.getElementById('incomingAvatar').textContent = initials(data.fromName);
  document.getElementById('incomingName').textContent = data.fromName;
  document.getElementById('incomingType').textContent = (data.type === 'video' ? 'Incoming video call' : 'Incoming voice call');
  document.getElementById('incomingBanner').classList.add('active');
}
function hideIncomingBanner(){
  pendingIncoming = null;
  document.getElementById('incomingBanner').classList.remove('active');
}

document.getElementById('declineCallBtn').onclick = async () => {
  if(!pendingIncoming) return;
  await db.collection("calls").doc(currentUser.uid).update({ status: "declined" });
  hideIncomingBanner();
};

document.getElementById('acceptCallBtn').onclick = async () => {
  if(!pendingIncoming) return;
  const data = pendingIncoming;
  hideIncomingBanner();
  currentCallRole = 'callee';
  currentCallType = data.type;
  currentCallDocRef = db.collection("calls").doc(currentUser.uid);

  try{
    localStream = await navigator.mediaDevices.getUserMedia({
      audio:true, video: data.type === 'video'
    });
  }catch(e){
    alert("Couldn't access your microphone/camera: " + e.message);
    await currentCallDocRef.update({ status: "declined" });
    return;
  }

  showCallOverlay({ displayName: data.fromName }, data.type, "Connecting…");

  pc = new RTCPeerConnection(rtcConfig);
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  wireRemoteStream();

  pc.onicecandidate = (e) => {
    if(e.candidate) currentCallDocRef.collection("calleeCandidates").add(e.candidate.toJSON());
  };

  await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  await currentCallDocRef.update({
    status: "accepted",
    answer: { type: answer.type, sdp: answer.sdp }
  });
  document.getElementById('callStatusText').textContent = "Connected";

  unsubCallDoc = currentCallDocRef.onSnapshot(snap => {
    const d = snap.data();
    if(!d) return;
    if(d.status === "ended") cleanupCall(false);
  });

  unsubRemoteCandidates = currentCallDocRef.collection("callerCandidates")
    .onSnapshot(snap => {
      snap.docChanges().forEach(change => {
        if(change.type === "added" && pc){
          pc.addIceCandidate(new RTCIceCandidate(change.doc.data())).catch(()=>{});
        }
      });
    });
};

function wireRemoteStream(){
  const remoteStream = new MediaStream();
  document.getElementById('remoteVideo').srcObject = remoteStream;
  document.getElementById('localVideo').srcObject = localStream;
  pc.ontrack = (event) => {
    event.streams[0].getTracks().forEach(t => remoteStream.addTrack(t));
  };
}

function showCallOverlay(peer, type, statusText){
  document.getElementById('callOverlay').classList.add('active');
  document.getElementById('callPeerName').textContent = peer.displayName;
  document.getElementById('callAvatarBig').textContent = initials(peer.displayName);
  document.getElementById('callStatusText').textContent = statusText;
  const stage = document.getElementById('videoStage');
  if(type === 'video'){
    stage.classList.add('active');
    document.getElementById('callAvatarBig').style.display = 'none';
  } else {
    stage.classList.remove('active');
    document.getElementById('callAvatarBig').style.display = 'flex';
  }
  isMuted = false;
  document.getElementById('muteBtn').classList.remove('muted');
}

document.getElementById('endCallBtn').onclick = () => cleanupCall(true);

async function cleanupCall(notifyRemote){
  if(notifyRemote && currentCallDocRef){
    await currentCallDocRef.update({ status: "ended" }).catch(()=>{});
  }
  if(pc){ pc.close(); pc = null; }
  if(localStream){ localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  if(unsubCallDoc) { unsubCallDoc(); unsubCallDoc = null; }
  if(unsubRemoteCandidates) { unsubRemoteCandidates(); unsubRemoteCandidates = null; }
  document.getElementById('callOverlay').classList.remove('active');
  document.getElementById('remoteVideo').srcObject = null;
  document.getElementById('localVideo').srcObject = null;

  // Clean up candidate subcollections + doc after a short delay (best-effort)
  if(currentCallDocRef){
    const ref = currentCallDocRef;
    setTimeout(async () => {
      try{
        const cc = await ref.collection("callerCandidates").get();
        cc.forEach(d => d.ref.delete());
        const ce = await ref.collection("calleeCandidates").get();
        ce.forEach(d => d.ref.delete());
        await ref.delete();
      }catch(err){}
    }, 1500);
  }
  currentCallDocRef = null;
  currentCallRole = null;
}

document.getElementById('muteBtn').onclick = () => {
  if(!localStream) return;
  isMuted = !isMuted;
  localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
  document.getElementById('muteBtn').classList.toggle('muted', isMuted);
};

window.addEventListener('beforeunload', () => {
  if(currentUser){
    db.collection("users").doc(currentUser.uid).update({ online:false }).catch(()=>{});
  }
});
</script>
