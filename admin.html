<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Elysian Threads</title>
    <style>
        body { margin:0; font-family:'Segoe UI', system-ui, sans-serif; background:#faf8f5; color:#2c2c2c; }
        .container { max-width:1100px; margin:0 auto; padding:2rem; }
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem; }
        .brand { font-family:Georgia, serif; font-size:1.8rem; color:#1e2a38; }
        .brand span { color:#c9a96e; }
        .login-box, .dashboard { background:#fff; border-radius:12px; padding:2rem; box-shadow:0 4px 20px rgba(0,0,0,0.08); }
        .login-box { max-width:400px; margin:4rem auto; text-align:center; }
        .login-box input { width:100%; padding:0.7rem; border-radius:8px; border:1.5px solid #e8e4df; font-size:1rem; margin:0.8rem 0; }
        .btn { padding:0.6rem 1.5rem; border-radius:50px; border:none; cursor:pointer; font-weight:600; font-size:0.9rem; }
        .btn-primary { background:#1e2a38; color:#fff; }
        .btn-danger { background:#c0392b; color:#fff; }
        .btn-success { background:#27ae60; color:#fff; }
        .btn:hover { opacity:0.9; }
        .form-row { display:flex; gap:1rem; flex-wrap:wrap; margin-bottom:1rem; }
        .form-group { flex:1; min-width:150px; }
        .form-group label { font-size:0.8rem; font-weight:600; color:#6b6b6b; text-transform:uppercase; display:block; margin-bottom:0.2rem; }
        .form-group input, .form-group select { width:100%; padding:0.55rem; border-radius:8px; border:1.5px solid #e8e4df; font-size:0.9rem; }
        table { width:100%; border-collapse:collapse; margin-top:1rem; font-size:0.85rem; }
        th, td { padding:0.7rem; text-align:left; border-bottom:1px solid #e8e4df; }
        th { background:#f9f7f4; font-weight:700; color:#1e2a38; text-transform:uppercase; font-size:0.75rem; }
        .section-title { font-family:Georgia, serif; color:#1e2a38; margin:1.5rem 0 0.8rem; border-bottom:2px solid #c9a96e; padding-bottom:0.4rem; display:inline-block; }
        .back-link { color:#a8874e; text-decoration:none; font-weight:600; }
        .stock-dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
        .stock-ok{background:#27ae60;} .stock-low{background:#e74c3c;} .stock-out{background:#999;}
        .toast { position:fixed; bottom:2rem; right:2rem; background:#1e2a38; color:#fff; padding:0.8rem 1.5rem; border-radius:50px; font-weight:600; z-index:300; animation:slideUp 0.3s ease, fadeOut 0.3s ease 2.5s forwards; }
        @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
        @keyframes fadeOut{to{opacity:0;transform:translateY(20px)}}
        .btn-sm { padding:0.35rem 0.8rem; font-size:0.8rem; margin-right:0.3rem; }
        .img-preview { display:flex; gap:0.5rem; flex-wrap:wrap; margin-top:0.5rem; }
        .img-preview img { width:60px; height:60px; object-fit:cover; border-radius:6px; border:1px solid #e8e4df; }
        .file-upload { margin-top:0.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="brand">Elysian<span>Threads</span> <span style="font-size:0.9rem;color:#6b6b6b;">Admin</span></div>
            <a href="index.html" class="back-link">← Back to Store</a>
        </div>
        <div style="background:#fff; padding:0.5rem 1rem; border-radius:8px; margin-bottom:1rem; font-size:0.8rem;" id="statusLine">⏳ Loading...</div>

        <!-- Login -->
        <div class="login-box" id="loginBox">
            <h2>🔐 Admin Access</h2>
            <input type="password" id="passwordInput" placeholder="Enter password" onkeydown="if(event.key==='Enter')login()">
            <button class="btn btn-primary" onclick="login()">Login</button>
        </div>

        <!-- Dashboard -->
        <div class="dashboard" id="dashboard" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2>📋 Inventory Management</h2>
                <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
            </div>

            <!-- Add Item Form -->
            <div style="background:#fff; padding:1.5rem; border-radius:12px; margin:1.5rem 0;">
                <h3>➕ Add New Item</h3>
                <div class="form-row">
                    <div class="form-group"><label>Name *</label><input type="text" id="addName"></div>
                    <div class="form-group"><label>Category *</label><select id="addCategory"><option>Men</option><option>Women</option><option>Kids</option><option>Accessories</option></select></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Price (₹) *</label><input type="number" id="addPrice" min="1"></div>
                    <div class="form-group"><label>Size</label><input type="text" id="addSize"></div>
                    <div class="form-group"><label>Color</label><input type="text" id="addColor"></div>
                    <div class="form-group"><label>Stock *</label><input type="number" id="addStock" value="10" min="1"></div>
                </div>
                <div class="form-group">
                    <label>Images (max 7)</label>
                    <input type="file" id="imageUpload" accept="image/*" multiple class="file-upload" onchange="previewImages()">
                    <div class="img-preview" id="imagePreview"></div>
                </div>
                <button class="btn btn-primary" onclick="addItem()">✅ Add to Inventory</button>
            </div>

            <!-- Inventory Table -->
            <h3 class="section-title">📦 Current Inventory</h3>
            <div id="inventoryEmpty" style="display:none;">Inventory is empty.</div>
            <table id="inventoryTable" style="display:none;">
                <thead><tr><th>Img</th><th>Name</th><th>Category</th><th>Price</th><th>Size</th><th>Color</th><th>Stock</th><th>Actions</th></tr></thead>
                <tbody id="inventoryBody"></tbody>
            </table>

            <!-- Reservations -->
            <h3 class="section-title">📞 Reservations (Call 1234567890)</h3>
            <div id="reservationsEmpty" style="display:none;">No reservations yet.</div>
            <table id="reservationsTable" style="display:none;">
                <thead><tr><th>#</th><th>Item</th><th>Category</th><th>Price</th><th>Reserved At</th></tr></thead>
                <tbody id="reservationsBody"></tbody>
            </table>
            <button class="btn btn-danger btn-sm" style="margin-top:1rem;" onclick="clearReservations()">🗑️ Clear Reservations</button>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script>
        const PASSWORD = 'SAKORA!';
        const STORAGE_INVENTORY = 'elysian_threads_inventory';
        const STORAGE_RESERVATIONS = 'elysian_threads_reservations';

        const SEED = [
            { id:'1', name:'Classic Wool Suit', category:'Men', price:8999, size:'M,L,XL', color:'Charcoal Grey', stock:8, images:[] },
            { id:'2', name:'Linen Casual Shirt', category:'Men', price:2499, size:'S,M,L,XL', color:'Sky Blue', stock:15, images:[] },
            { id:'3', name:'Slim Fit Chinos', category:'Men', price:3299, size:'30-38', color:'Khaki', stock:12, images:[] },
            { id:'4', name:'Evening Silk Gown', category:'Women', price:12999, size:'S,M,L', color:'Burgundy', stock:5, images:[] },
            { id:'5', name:'Floral Maxi Dress', category:'Women', price:4599, size:'XS-L', color:'Rose Pink', stock:10, images:[] },
            { id:'6', name:'Designer Blouse', category:'Women', price:1899, size:'S,M,L,XL', color:'Ivory White', stock:20, images:[] },
            { id:'7', name:'Kids Denim Jacket', category:'Kids', price:1799, size:'4Y-12Y', color:'Light Wash', stock:14, images:[] },
            { id:'8', name:'Cotton T-Shirt Pack', category:'Kids', price:999, size:'2Y-10Y', color:'Assorted', stock:25, images:[] },
            { id:'9', name:'Leather Handbag', category:'Accessories', price:5499, size:'One Size', color:'Tan Brown', stock:6, images:[] },
            { id:'10', name:'Silk Printed Scarf', category:'Accessories', price:1499, size:'One Size', color:'Multicolor', stock:18, images:[] }
        ];

        let inventory = [], reservations = [], tempImageFiles = [];

        function loadData(){
            try {
                inventory = JSON.parse(localStorage.getItem(STORAGE_INVENTORY)) || JSON.parse(JSON.stringify(SEED));
                reservations = JSON.parse(localStorage.getItem(STORAGE_RESERVATIONS)) || [];
                if(!localStorage.getItem(STORAGE_INVENTORY)) localStorage.setItem(STORAGE_INVENTORY, JSON.stringify(inventory));
                document.getElementById('statusLine').textContent = '✅ Data loaded (' + inventory.length + ' items)';
            } catch(e){ document.getElementById('statusLine').textContent = '❌ Error'; }
        }

        function saveAll(){
            localStorage.setItem(STORAGE_INVENTORY, JSON.stringify(inventory));
            localStorage.setItem(STORAGE_RESERVATIONS, JSON.stringify(reservations));
        }

        function showToast(msg){
            const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
            document.getElementById('toastContainer').appendChild(t);
            setTimeout(()=>t.remove(),3000);
        }

        function previewImages(){
            const files = document.getElementById('imageUpload').files;
            const preview = document.getElementById('imagePreview');
            preview.innerHTML = '';
            if(files.length > 7){ showToast('Maximum 7 images allowed'); return; }
            tempImageFiles = [];
            for(let i=0; i<files.length; i++){
                const reader = new FileReader();
                reader.onload = function(e){
                    tempImageFiles.push(e.target.result);
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    preview.appendChild(img);
                    if(tempImageFiles.length === files.length){
                        // all loaded
                    }
                };
                reader.readAsDataURL(files[i]);
            }
        }

        async function readFilesAsDataURLs(files){
            const promises = [];
            for(let i=0; i<files.length; i++){
                promises.push(new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = e => resolve(e.target.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(files[i]);
                }));
            }
            return Promise.all(promises);
        }

        window.addItem = async function(){
            const name = document.getElementById('addName').value.trim();
            const category = document.getElementById('addCategory').value;
            const price = parseFloat(document.getElementById('addPrice').value);
            const size = document.getElementById('addSize').value.trim();
            const color = document.getElementById('addColor').value.trim();
            const stock = parseInt(document.getElementById('addStock').value);
            const files = document.getElementById('imageUpload').files;

            if(!name || isNaN(price) || price<=0 || isNaN(stock) || stock<0){
                showToast('⚠️ Fill Name, Price, Stock');
                return;
            }
            if(files.length > 7){
                showToast('Maximum 7 images');
                return;
            }

            let imageArray = [];
            if(files.length > 0){
                try {
                    imageArray = await readFilesAsDataURLs(files);
                } catch(e){ showToast('Error reading images'); return; }
            }

            const newItem = {
                id: 'item_'+Date.now()+'_'+Math.random().toString(36).substr(2,5),
                name, category, price, size, color, stock, images: imageArray
            };
            inventory.push(newItem);
            saveAll();
            // clear form
            ['addName','addPrice','addSize','addColor','addStock'].forEach(id => document.getElementById(id).value = (id==='addStock'?'10':''));
            document.getElementById('imageUpload').value = '';
            document.getElementById('imagePreview').innerHTML = '';
            tempImageFiles = [];
            renderAll();
            showToast('✅ Item added');
        };

        window.deleteItem = function(id){
            if(!confirm('Delete?')) return;
            inventory = inventory.filter(i=>i.id!==id);
            saveAll();
            renderAll();
            showToast('🗑️ Deleted');
        };

        window.restockItem = function(id, qty){
            const item = inventory.find(i=>i.id===id);
            if(item){ item.stock += qty; saveAll(); renderAll(); showToast('📦 +'+qty); }
        };

        window.clearReservations = function(){
            if(!confirm('Clear all?')) return;
            reservations = [];
            saveAll();
            renderAll();
            showToast('🗑️ Cleared');
        };

        function renderAll(){ renderInventory(); renderReservations(); }

        function renderInventory(){
            const tbody = document.getElementById('inventoryBody');
            const table = document.getElementById('inventoryTable');
            const empty = document.getElementById('inventoryEmpty');
            if(inventory.length===0){ table.style.display='none'; empty.style.display='block'; return; }
            table.style.display='table'; empty.style.display='none';
            tbody.innerHTML = inventory.map(item => {
                const firstImg = (item.images && item.images.length>0) ? item.images[0] : '';
                const imgCell = firstImg
                    ? `<img src="${firstImg}" style="width:40px;height:40px;object-fit:cover;border-radius:6px;">`
                    : `<span style="width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;background:#e8e4df;border-radius:6px;">👕</span>`;
                let dot = 'stock-ok';
                if(item.stock<=0) dot='stock-out';
                else if(item.stock<=3) dot='stock-low';
                return `<tr>
                    <td>${imgCell}</td>
                    <td><strong>${escapeHtml(item.name)}</strong></td>
                    <td>${escapeHtml(item.category)}</td>
                    <td>₹${item.price.toLocaleString('en-IN')}</td>
                    <td>${escapeHtml(item.size||'-')}</td>
                    <td>${escapeHtml(item.color||'-')}</td>
                    <td><span class="stock-dot ${dot}"></span>${item.stock}</td>
                    <td>
                        <button class="btn btn-success btn-sm" onclick="restockItem('${item.id}',5)">+5</button>
                        <button class="btn btn-success btn-sm" onclick="restockItem('${item.id}',1)">+1</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteItem('${item.id}')">🗑️</button>
                    </td>
                </tr>`;
            }).join('');
        }

        function renderReservations(){
            const tbody = document.getElementById('reservationsBody');
            const table = document.getElementById('reservationsTable');
            const empty = document.getElementById('reservationsEmpty');
            if(reservations.length===0){ table.style.display='none'; empty.style.display='block'; return; }
            table.style.display='table'; empty.style.display='none';
            tbody.innerHTML = reservations.map((r,i)=>`
                <tr><td>${i+1}</td><td><strong>${escapeHtml(r.itemName)}</strong></td><td>${escapeHtml(r.itemCategory)}</td><td>₹${r.itemPrice}</td><td>${r.timestamp}</td></tr>
            `).join('');
        }

        function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

        window.login = function(){
            if(document.getElementById('passwordInput').value === PASSWORD){
                document.getElementById('loginBox').style.display='none';
                document.getElementById('dashboard').style.display='block';
                showToast('✅ Welcome');
                renderAll();
            } else showToast('❌ Wrong password');
        };

        window.logout = function(){
            document.getElementById('loginBox').style.display='block';
            document.getElementById('dashboard').style.display='none';
            document.getElementById('passwordInput').value='';
        };

        loadData();
    </script>
</body>
</html>
